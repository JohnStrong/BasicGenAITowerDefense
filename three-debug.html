<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Three.js Debug</title>
<style>
  body { margin: 0; background: #000; }
  canvas { display: block; }
  #log { position: fixed; top: 0; left: 0; color: #0f0; font: 12px monospace;
         background: rgba(0,0,0,0.7); padding: 8px; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log">Loading THREE.js...</div>
<script src="js/three.min.js"></script>
<script>
const log = document.getElementById('log');
function L(s) { log.textContent += '\n' + s; console.log(s); }

const canvas = document.getElementById('c');
canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;

L('THREE version: ' + THREE.REVISION);

// Renderer
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.setClearColor(0x4DD0E1, 1);
renderer.setSize(canvas.width, canvas.height, false);
L('Renderer: ' + renderer.info.render.frame);

// Scene + lights
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(-3, 5, -2);
scene.add(sun);

// Camera
const hw = canvas.width  / 2 / 0.7;
const hh = canvas.height / 2 / 0.7;
const cam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 1, 20000);

// ISO direction
const ISO = new THREE.Vector3(1, Math.SQRT2, 1).normalize();
cam.position.copy(new THREE.Vector3(0,0,0)).addScaledVector(ISO, 2500);
cam.lookAt(0, 0, 0);
cam.updateProjectionMatrix();
L('Camera pos: ' + cam.position.x.toFixed(0) + ' ' + cam.position.y.toFixed(0) + ' ' + cam.position.z.toFixed(0));

// Build a small 5x5 grid of boxes
const TW = 80, TD = 80, BH = 20;
const COLORS = [0x4CAF50, 0x29B6F6, 0x8D6E63, 0xB0BEC5, 0x9E9E9E];
const dummy  = new THREE.Object3D();
let tileCount = 0;

for (let ci = 0; ci < COLORS.length; ci++) {
    const geo  = new THREE.BoxGeometry(TW - 4, BH, TD - 4);
    const mat  = new THREE.MeshLambertMaterial({ color: COLORS[ci] });
    const N    = 5;
    const mesh = new THREE.InstancedMesh(geo, mat, N);

    for (let i = 0; i < N; i++) {
        const col = ci * 2;
        const row = i;
        dummy.position.set(col * TW, -BH / 2, row * TD);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        tileCount++;
    }
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
}
L('Tiles placed: ' + tileCount);

// Centre camera
const mapCX = (4 * 2 * TW) / 2;
const mapCZ = (4 * TD) / 2;
cam.position.set(mapCX, 0, mapCZ).addScaledVector(ISO, 2500);
cam.lookAt(mapCX, 0, mapCZ);
L('Look at: ' + mapCX + ' 0 ' + mapCZ);

// Render loop
function tick() {
    renderer.render(scene, cam);
    requestAnimationFrame(tick);
}
tick();
L('Rendering...');
</script>
</body>
</html>
