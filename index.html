<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulwark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #4DD0E1;
            font-family: monospace;
        }
        #canvasContainer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #threeCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #gameCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
        }
        #ui {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">Isometric view (2.5D)</div>
    <div id="canvasContainer">
        <canvas id="threeCanvas"></canvas>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="js/game-logic/utils.js"></script>
    <script src="js/game-logic/animation-controller.js"></script>
    <script src="js/game-logic/sprites.js"></script>
    <script src="js/game-logic/unit-manager.js"></script>
    <script src="js/game-logic/lib/ai/pathfinding-engine.js"></script>
    <script src="js/game-logic/lib/ai/enemy-manager.js"></script>
    <script src="js/game-logic/lib/iso-camera.js"></script>
    <script src="js/game-logic/lib/iso-input.js"></script>
    <script src="js/three.min.js"></script>
    <script src="js/game-logic/lib/three-terrain-renderer.js"></script>
    <script src="js/game-logic/lib/iso-renderer.js"></script>
    <script src="js/game-logic/lib/hud.js"></script>
    <script src="js/game-logic/level-loader.js"></script>
    <script src="js/game-logic/game-iso.js"></script>
</body>
</html>
